
backend:
  name: github
  repo: michael-brosius/unser-haus-entsteht
  branch: main
  base_url: https://hausbau-cms-auth.michaelbrosius.workers.dev
  auth_endpoint: auth

site_url: https://www.bauprojekt-brosius.de/
display_url: https://www.bauprojekt-brosius.de/

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: de

collections:
  - name: "bautagebuch"
    label: "Bautagebuch"
    folder: "content/beitraege"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - label: "Überschrift"
        name: "title"
        widget: "string"

      - label: "Datum"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"

      - label: "Bauphase"
        name: "phase"
        widget: "select"
        options:
          - "Grundstückskauf"
          - "Abriss"
          - "Vorbereitung"
          - "Erdarbeiten"
          - "Fundament"
          - "Rohbau"
          - "Innenausbau"
          - "Einzug"

      - label: "Beitrag"
        name: "body"
        widget: "markdown"

      - label: "Fotos"
        name: "photos"
        widget: "list"
        required: false
        field:
          label: "Foto"
          name: "image"
          widget: "image"

      - label: "YouTube-Link"
        name: "youtube"
        widget: "string"
        required: false

  - name: "webseite"
    label: "Webseite bearbeiten"
    files:
      - name: "seite"
        label: "Startseite und Galerie"
        file: "content/seite.json"
        format: "json"
        fields:
          - {label: "Kleine Überschrift im Titelbild", name: "hero_eyebrow", widget: "string"}
          - {label: "Große Überschrift im Titelbild", name: "hero_title", widget: "text"}
          - {label: "Untertitel im Titelbild", name: "hero_subtitle", widget: "text"}
          - {label: "Einleitung – kleine Überschrift", name: "intro_tag", widget: "string"}
          - {label: "Einleitung – große Überschrift", name: "intro_title", widget: "text"}
          - {label: "Einleitung – Text", name: "intro_text", widget: "text"}
          - {label: "Galerie – kleine Überschrift", name: "gallery_tag", widget: "string"}
          - {label: "Galerie – große Überschrift", name: "gallery_title", widget: "string"}
          - {label: "Galerie – Beschreibung", name: "gallery_text", widget: "text"}
          - label: "Bilder der Hausgalerie (Reihenfolge per Drag & Drop)"
            name: "gallery_images"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - {label: "Bild", name: "image", widget: "image"}
              - {label: "Bildbeschreibung", name: "alt", widget: "string", required: false}
