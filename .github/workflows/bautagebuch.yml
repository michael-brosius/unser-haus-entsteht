
name: Bautagebuch aktualisieren

on:
  push:
    branches:
      - main
    paths:
      - "content/beitraege/**"
      - "scripts/build-beitraege.py"
      - ".github/workflows/bautagebuch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install pyyaml markdown

      - name: Bautagebuch-Daten erzeugen
        run: python scripts/build-beitraege.py

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/beitraege.json
          if ! git diff --cached --quiet; then
            git commit -m "Bautagebuch-Daten aktualisieren"
            git push
          fi
